#!/usr/bin/nft -f
# vim:set ts=2 sw=2 et:

# IPv4/IPv6 Simple & Safe firewall ruleset.
# More examples in /usr/share/nftables/ and /usr/share/doc/nftables/examples/.

destroy table inet filter
table inet filter {
  chain input {
    type filter hook input priority filter
    policy drop

    ct state invalid drop comment "early drop of invalid connections"
    ct state {established, related} accept comment "allow tracked connections"
    iif lo accept comment "allow from loopback"

    # Allow LAN (IPv4 only) to reach high ports (e.g. dev HTTP servers)
    ip saddr { 192.168.0.0/24, 192.168.178.0/24 } tcp dport >= 1024 accept comment "allow LAN to high TCP ports"

    tcp dport ssh accept comment "allow sshd"

    # ICMPv4: allow only essential types
    ip protocol icmp icmp type { destination-unreachable, time-exceeded } accept
    ip protocol icmp icmp type echo-request limit rate 1/second burst 4 packets accept comment "rate-limited ping"

    # ICMPv6: allow essential types including Neighbor Discovery (required for IPv6)
    ip6 nexthdr icmpv6 icmpv6 type {
      destination-unreachable, packet-too-big,
      time-exceeded, parameter-problem,
      nd-neighbor-solicit, nd-neighbor-advert,
      nd-router-solicit, nd-router-advert
    } accept comment "essential ICMPv6 + Neighbor Discovery"
    ip6 nexthdr icmpv6 icmpv6 type echo-request limit rate 1/second burst 4 packets accept comment "rate-limited ping6"

    pkttype host limit rate 5/second counter reject with icmpx type admin-prohibited
    counter
  }
  chain forward {
    type filter hook forward priority filter
    policy drop
  }
}
